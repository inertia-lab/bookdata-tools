[build-system]
requires = ["uv_build ~=0.8"]
build-backend = "uv_build"

[project]
name = "bookdata"
version = "4.0"
description = "Book data integration tools"
authors = [{ name = "Michael Ekstrand", email = "mdekstrand@drexel.edu" }]
requires-python = "~=3.12"

[project.scripts]
duckscript = "bookdata.duckscript:main"

[tool.uv.build-backend]
module-root = "src/python"

[tool.pyright]
exclude = [".pixi/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", "__pycache__", "build", "dist", "*/tests/*", ".pixi/*"]

[tool.ruff.lint]
select = ["E", "F", "I"]
unfixable = ["F401"]
